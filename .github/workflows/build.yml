name: Build Debian packages

on:
  push:
    branches: [master]
    tags: ['menta/*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git devscripts equivs build-essential fakeroot

      - uses: actions/checkout@v4

      - name: Fetch upstream tarball
        run: |
          UPSTREAM=$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')
          mkdir -p ../build
          curl -fsSL -o "../build/mate-desktop_${UPSTREAM}.orig.tar.xz" \
            "https://github.com/mate-desktop/mate-desktop/releases/download/v${UPSTREAM}/mate-desktop-${UPSTREAM}.tar.xz"
          tar -C ../build -xf "../build/mate-desktop_${UPSTREAM}.orig.tar.xz"
          cp -a debian "../build/mate-desktop-${UPSTREAM}/"
          echo "SRCDIR=$(realpath ../build/mate-desktop-${UPSTREAM})" >> "$GITHUB_ENV"

      - name: Install build dependencies
        working-directory: ${{ env.SRCDIR }}
        run: |
          mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control

      - name: Build
        working-directory: ${{ env.SRCDIR }}
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -v ../build/*.deb ../build/*.buildinfo ../build/*.changes "$GITHUB_WORKSPACE/artifacts/"

      - uses: actions/upload-artifact@v4
        with:
          name: mate-desktop-debs
          path: artifacts/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/menta/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mate-desktop-debs
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
